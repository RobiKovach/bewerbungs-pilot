name: Feature request
description: Suggest an idea for BewerbungsPilot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing or hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could the app help? Please do not paste personal data.
    validations:
      required: true
