# BewerbungsPilot Worker (spec 0.11.0). Secrets (ROBERT_EMAIL, RESEND_API_KEY) are set with `wrangler secret put`,
# never written here. The D1 database_id is filled in at the first deploy (Task 3) — it is not a secret.
name = "bewerbungspilot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
send_metrics = false

[[d1_databases]]
binding = "DB"
database_name = "bewerbungspilot"
database_id = "ab0fb853-8a71-4409-8c7d-a8a60260d53c"

[triggers]
# Hourly: IP rate-limit rows must be gone within 2 hours (spec), expired codes and sessions too.
crons = ["0 * * * *"]
